<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teclazo: pelea de código</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#ece8fb; --surface:#ffffff; --ink:#1d1640; --muted:#5d5788; --line:#cfc8ef;
  --hero:#b07c00; --hero-fill:#ffcf3a; --foe:#d42f6c; --time:#1a8fbd;
  --ok:#17894a; --bad:#cf2f2f; --bad-bg:#ffd9d9; --pend:#8a84b0; --floor:#d9d2f6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#191435; --surface:#251f4d; --ink:#f3f0ff; --muted:#a9a2d6; --line:#3b3473;
    --hero:#ffcf3a; --hero-fill:#ffcf3a; --foe:#ff5893; --time:#3fcff5;
    --ok:#62e394; --bad:#ff6464; --bad-bg:#5a1f33; --pend:#7e77b3; --floor:#221c47;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#191435; --surface:#251f4d; --ink:#f3f0ff; --muted:#a9a2d6; --line:#3b3473;
  --hero:#ffcf3a; --hero-fill:#ffcf3a; --foe:#ff5893; --time:#3fcff5;
  --ok:#62e394; --bad:#ff6464; --bad-bg:#5a1f33; --pend:#7e77b3; --floor:#221c47;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  display:flex; justify-content:center;
}
.game{width:100%;max-width:860px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative}
h1,.display{font-family:"Bungee","Impact","Arial Black",sans-serif;font-weight:400;letter-spacing:.02em}

/* Barra superior */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.fighter-info{display:flex;flex-direction:column;gap:6px}
.fighter-info.right{align-items:flex-end;text-align:right}
.fname{font-size:.85rem;color:var(--muted)}
.hp{width:100%;height:16px;background:var(--surface);border:2px solid var(--line);border-radius:4px;overflow:hidden}
.hp>div{height:100%;transition:width .25s ease}
#playerHp>div{background:var(--hero-fill)}
#enemyHp>div{background:var(--foe);margin-left:auto}
.round{font-family:"Bungee","Impact",sans-serif;font-size:1.1rem;text-align:center;line-height:1.1}
.round small{display:block;font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--muted)}

/* Arena */
}

function loop(now){
  if(!S.running) return;
  const dt=now-S.last; S.last=now;
  if(!S.paused){
    S.timeLeft-=dt;
    const pct=Math.max(0,S.timeLeft/S.timeTotal*100);
    $('timebar').firstElementChild.style.width=pct+'%';
    $('timebar').classList.toggle('low',pct<30);
    if(S.timeLeft<=0) timeout();
  }
  requestAnimationFrame(loop);
}

/* Eventos */
typer.addEventListener('input',onInput);
typer.addEventListener('paste',e=>e.preventDefault());
typer.addEventListener('drop',e=>e.preventDefault());
typer.addEventListener('keydown',e=>{ if(e.key==='Enter') e.preventDefault(); });
$('game').addEventListener('click',e=>{ if(S.running && e.target.tagName!=='BUTTON') typer.focus(); });
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
$('menuBtn').addEventListener('click',()=>{ $('endScreen').hidden=true; $('startScreen').hidden=false; updateBestLbl(); });
$('quitBtn').addEventListener('click',()=>{ if(S.running){ S.paused=true; gameOver(); } });
$('soundBtn').addEventListener('click',()=>{ sound=!sound; $('soundBtn').textContent='Sonido: '+(sound?'sí':'no'); store('teclazo-sound',sound?'1':'0'); typer.focus(); });
document.querySelectorAll('input[name=lang]').forEach(r=>r.addEventListener('change',()=>{
  const custom=getSettings().lang==='custom';
  $('customSet').hidden=!custom; $('levelSet').hidden=custom; updateBestLbl();
}));
document.querySelectorAll('input[name=level]').forEach(r=>r.addEventListener('change',updateBestLbl));
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !$('startScreen').hidden && document.activeElement.tagName!=='TEXTAREA'){ startGame(); }
});

/* Estado inicial */
const savedCustom=load('teclazo-custom'); if(savedCustom) $('customList').value=savedCustom;
if(load('teclazo-sound')==='0'){ sound=false; $('soundBtn').textContent='Sonido: no'; }
S={running:false,target:'',level:1};
targetEl.textContent='';
updateBestLbl();
</script>
</body>
</html>
